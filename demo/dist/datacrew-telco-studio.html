<title>DataCrew Telco Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout concept: an operations console. Fixed rail on the left (top tabs on phones),
   one working canvas, three plane colours (Build / Operate / Consume) used as signal,
   never as decoration. */
:root {
  --bg: #F3F6F8;
  --surface: #FFFFFF;
  --surface-2: #E9EEF2;
  --ink: #0D1B26;
  --muted: #566878;
  --line: #D3DCE3;
  --accent: #2346C8;
  --build: #2346C8;
  --build-soft: #E3E9FC;
  --operate: #B4470E;
  --operate-soft: #FBEADF;
  --consume: #0B7468;
  --consume-soft: #DDF3EF;
  --ok: #157F3B;
  --ok-soft: #DDF3E4;
  --warn: #A15C07;
  --warn-soft: #FCEFD6;
  --crit: #B42323;
  --crit-soft: #FBE1E1;
  --code-bg: #0F1E2B;
  --code-fg: #D6E2EC;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A131B; --surface: #111D27; --surface-2: #172633; --ink: #E4ECF2; --muted: #93A5B5; --line: #24384A;
    --accent: #8FA6FF; --build: #8FA6FF; --build-soft: #1B2850; --operate: #FB9452; --operate-soft: #3A2212;
    --consume: #3FD3BE; --consume-soft: #0F3330; --ok: #4ADE80; --ok-soft: #12321F; --warn: #FBBF24; --warn-soft: #362A0E;
    --crit: #F87171; --crit-soft: #3A1515; --code-bg: #07101A; --code-fg: #D6E2EC; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A131B; --surface: #111D27; --surface-2: #172633; --ink: #E4ECF2; --muted: #93A5B5; --line: #24384A;
  --accent: #8FA6FF; --build: #8FA6FF; --build-soft: #1B2850; --operate: #FB9452; --operate-soft: #3A2212;
  --consume: #3FD3BE; --consume-soft: #0F3330; --ok: #4ADE80; --ok-soft: #12321F; --warn: #FBBF24; --warn-soft: #362A0E;
  --crit: #F87171; --crit-soft: #3A1515; --code-bg: #07101A; --code-fg: #D6E2EC; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 1.9rem; line-height: 1.15; }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.05rem; }
h4 { font-size: 0.92rem; }
p { margin: 0; }
a { color: var(--accent); }
code, pre, .mono { font-family: var(--f-mono); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; gap: 10px; align-items: center; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.05rem; display: block; line-height: 1.1; }
.brand small { color: var(--muted); font-size: 0.75rem; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--dot, var(--accent)); }
.nav .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--muted)); flex: none; }
.nav .count { margin-left: auto; font-size: 0.72rem; background: var(--crit); color: var(--surface); border-radius: 10px; padding: 0 7px; font-weight: 600; }
.nav-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 0 10px; margin-top: 6px; }
.rail-foot { margin-top: auto; font-size: 0.75rem; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.toggle input { accent-color: var(--accent); }

main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-direction: column; gap: 8px; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; color: var(--plane, var(--accent)); }
.lede { color: var(--muted); max-width: 72ch; font-size: 1rem; }

/* ---------- generic blocks ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.sub { color: var(--muted); font-size: 0.85rem; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.build { background: var(--build-soft); color: var(--build); }
.tag.operate { background: var(--operate-soft); color: var(--operate); }
.tag.consume { background: var(--consume-soft); color: var(--consume); }
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.crit { background: var(--crit-soft); color: var(--crit); }
.tag.cls { font-family: var(--f-mono); }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--plane, var(--accent)); border-color: var(--plane, var(--accent)); color: var(--surface); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 10px; font-size: 0.8rem; }
select, input[type="text"], textarea { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
textarea { width: 100%; resize: vertical; }
table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
pre.code { background: var(--code-bg); color: var(--code-fg); padding: 12px 14px; border-radius: 6px; overflow-x: auto; font-size: 0.78rem; line-height: 1.55; margin: 0; white-space: pre; }
ul.clean { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
ul.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }

/* ---------- overview ---------- */
.planes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.plane-card { border-top: 4px solid var(--plane); }
.plane-card h3 { color: var(--plane); }
.flow-svg { width: 100%; height: auto; display: block; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.kpi b { font-family: var(--f-display); font-size: 1.6rem; display: block; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 0.8rem; }
.note { font-size: 0.78rem; color: var(--muted); }
.domain-table td:first-child { font-weight: 600; white-space: nowrap; }

/* ---------- run console ---------- */
.run-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.scn-list { display: flex; flex-direction: column; gap: 8px; }
.scn { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--surface); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.scn:hover { border-color: var(--plane); }
.scn[aria-pressed="true"] { border-color: var(--plane); box-shadow: inset 3px 0 0 var(--plane); }
.scn b { font-size: 0.9rem; }
.scn small { color: var(--muted); }
.pipeline { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.stage { flex: 1 0 86px; min-width: 86px; border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font-size: 0.72rem; background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
.stage b { font-size: 0.75rem; line-height: 1.2; }
.stage .g { font-family: var(--f-mono); color: var(--muted); }
.stage.active { border-color: var(--plane); background: var(--surface-2); }
.stage.wait { border-color: var(--warn); background: var(--warn-soft); }
.stage.done { border-color: var(--ok); }
.stage.done .g { color: var(--ok); }
.stage.rej { border-color: var(--crit); background: var(--crit-soft); }
.console { background: var(--code-bg); color: var(--code-fg); border-radius: 8px; padding: 12px 14px; font-family: var(--f-mono); font-size: 0.78rem; height: 320px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.console .ln { display: grid; grid-template-columns: 62px 150px minmax(0, 1fr); gap: 10px; }
.console .t { color: #6D8597; }
.console .who { color: #9DB5FF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.console .who.h { color: #FFC37A; }
.console .who.sys { color: #6FE3CF; }
.console .msg { white-space: pre-wrap; word-break: break-word; }
.console .ln.gate .msg { color: #FFD48A; }
.console .ln.ok .msg { color: #8DEBA8; }
.console .ln.bad .msg { color: #FF9C9C; }
.console .empty { color: #6D8597; }
.artifacts { display: flex; flex-direction: column; gap: 8px; }
.art { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.art summary { cursor: pointer; padding: 8px 12px; display: flex; gap: 8px; align-items: center; font-size: 0.85rem; font-weight: 500; }
.art summary .sub { margin-left: auto; }
.art pre { margin: 0 10px 10px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--surface); }
.stat b { font-family: var(--f-display); font-size: 1.15rem; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.72rem; color: var(--muted); }

/* ---------- gate / approval card ---------- */
.gate-card { border: 1px solid var(--warn); background: var(--surface); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 4px 0 0 var(--warn); }
.gate-card.approved { border-color: var(--ok); box-shadow: inset 4px 0 0 var(--ok); }
.gate-card.rejected { border-color: var(--crit); box-shadow: inset 4px 0 0 var(--crit); }
.gate-card.changes { border-color: var(--operate); box-shadow: inset 4px 0 0 var(--operate); }
.gate-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.gate-top h4 { margin-right: auto; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 4px 14px; font-size: 0.82rem; }
.checks div::before { content: "\2713  "; color: var(--ok); font-weight: 700; }
.signers { display: flex; flex-wrap: wrap; gap: 8px; }
.signer { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; font-size: 0.8rem; }
.signer.signed { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.signer .who { display: flex; flex-direction: column; line-height: 1.25; }
.signer .who small { color: var(--muted); }
.hash { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); word-break: break-all; }

/* ---------- consume chat ---------- */
.chat-layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; align-items: start; }
.persona { text-align: left; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; background: var(--surface); cursor: pointer; }
.persona[aria-pressed="true"] { border-color: var(--consume); box-shadow: inset 3px 0 0 var(--consume); }
.persona small { display: block; color: var(--muted); font-family: var(--f-mono); font-size: 0.7rem; }
.chat { display: flex; flex-direction: column; gap: 12px; min-height: 360px; }
.msg-u { align-self: flex-end; background: var(--consume); color: var(--surface); padding: 9px 13px; border-radius: 12px 12px 2px 12px; max-width: 80%; }
.msg-a { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; border-radius: 12px 12px 12px 2px; max-width: 100%; width: 100%; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.msg-a .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 4px 12px; cursor: pointer; font-size: 0.82rem; }
.chip:hover { border-color: var(--consume); color: var(--consume); }
.ask-bar { display: flex; gap: 8px; }
.ask-bar input { flex: 1; min-width: 0; }
.action-card { border: 1px solid var(--consume); border-radius: 8px; padding: 12px; background: var(--consume-soft); display: flex; flex-direction: column; gap: 8px; }

/* ---------- approvals / audit ---------- */
.inbox-filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.audit { font-family: var(--f-mono); font-size: 0.74rem; }
.audit td { white-space: nowrap; }
.audit td.msgc { white-space: normal; min-width: 260px; }
.empty-state { padding: 26px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }

/* ---------- teams ---------- */
.team-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.team-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.plan-steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.plan-steps div { border-top: 3px solid var(--accent); background: var(--surface-2); padding: 10px; border-radius: 0 0 6px 6px; font-size: 0.85rem; }

/* ---------- research ---------- */
.research-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.research-item { display: flex; flex-direction: column; gap: 6px; }
.research-item .src { font-size: 0.78rem; }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 6px; font-size: 0.85rem; z-index: 50; max-width: 360px; }

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .run-layout, .chat-layout { grid-template-columns: minmax(0, 1fr); }
  .scn-list { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .scn { flex: 0 0 230px; }
  .kpis, .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; flex-direction: row; align-items: center; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); gap: 10px; z-index: 20; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
  .brand small, .nav-label, .rail-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; min-width: 0; }
  .nav a { white-space: nowrap; padding: 6px 9px; }
  .nav a[aria-current="page"] { box-shadow: inset 0 -3px 0 var(--dot, var(--accent)); }
  .planes, .g2, .g3, .research-list, .plan-steps { grid-template-columns: minmax(0, 1fr); }
  .stat-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .console .ln { grid-template-columns: 54px minmax(0, 1fr); }
  .console .ln .who { grid-column: 2; }
  .console .ln .msg { grid-column: 1 / -1; padding-left: 64px; }
  h1 { font-size: 1.5rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>

  <aside class="rail">
    <a class="brand" href="#overview" style="text-decoration:none;color:inherit">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="7" fill="var(--ink)"/>
        <path d="M9 24 a11 11 0 0 1 16 0" fill="none" stroke="var(--build)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M12 21 a6.5 6.5 0 0 1 10 0" fill="none" stroke="var(--operate)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="17" cy="24" r="2.4" fill="var(--consume)"/>
      </svg>
      <span><b>DataCrew Telco</b><small>Build · Operate · Consume</small></span>

    <nav class="nav" aria-label="Sections">

      <span class="nav-label">Agent planes</span>

<script>
/* DataCrew Telco Studio — demo data.
 * Everything in this file is synthetic. Operator, people, systems and figures are
 * fictional and exist only to drive the simulation. Market facts live in RESEARCH
 * and carry their source URL.
 */
window.DC = {};

/* ------------------------------------------------------------------ */
/* Human roles. Agents never sign a gate; each role is a named person. */
/* ------------------------------------------------------------------ */
DC.ROLES = {
  PO:   { title: 'Data Product Owner',        person: 'Aisha Rahman',   team: 'Business', plane: 'build' },
  ARCH: { title: 'Data Architect',            person: 'Marco Bianchi',  team: 'Dev',      plane: 'build' },
  STEW: { title: 'Data Steward',              person: 'Lena Fischer',   team: 'Governance', plane: 'build' },
  ENG:  { title: 'Engineering Lead',          person: 'Rahul Menon',    team: 'Dev',      plane: 'build' },
  QA:   { title: 'QA Lead',                   person: 'Sofia Alvarez',  team: 'Dev',      plane: 'build' },
  CHG:  { title: 'Change Manager (CAB)',      person: 'Tom O’Neill', team: 'Managed Services', plane: 'operate' },
  SEC:  { title: 'Security & Privacy Officer',person: 'Grace Okafor',   team: 'Risk',     plane: 'all' },
  MLL:  { title: 'ML Lead / Model Risk',      person: 'Kenji Watanabe', team: 'AI',       plane: 'build' },
  NOC:  { title: 'NOC Shift Lead',            person: 'Priya Natarajan',team: 'Managed Services', plane: 'operate' },
  SDM:  { title: 'Service Delivery Manager',  person: 'David Kowalski', team: 'Managed Services', plane: 'operate' },
  PRB:  { title: 'Problem Manager',           person: 'Nadia Haddad',   team: 'Managed Services', plane: 'operate' },
  CMP:  { title: 'Campaign Manager',          person: 'Chloe Martin',   team: 'Business', plane: 'consume' },
  CARE: { title: 'Customer Care Lead',        person: 'Samuel Adeyemi', team: 'Business', plane: 'consume' },
  RES:  { title: 'Research Lead',             person: 'Dr. Ines Duarte',team: 'Research', plane: 'all' }
};

/* Action classes used by every plane (Operate enforces them hardest). */

<script>
/* DataCrew Telco Studio — simulation engine and views. Vanilla JS, no build step. */
(function () {
  'use strict';
  const DC = window.DC;
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PLANE_VAR = { build: 'var(--build)', operate: 'var(--operate)', consume: 'var(--consume)' };

  /* ---------------- state ---------------- */
  const S = {
    view: 'overview',
    speed: 1,
    autoApprove: false,
    approvals: [],      // {id, plane, runId, gate, title, approvers, signed:{role:ts}, status, checks, evidence, hash, version, comment}
    audit: [],          // {ts, actor, kind, msg, hash}
    runs: { build: null, operate: null },
    sel: { build: DC.BUILD_SCENARIOS[0].id, operate: DC.OPERATE_SCENARIOS[0].id, persona: 'cco', team: 'dev' },
    chat: [],
    clock: 0,
    seq: 0
  };

  /* ---------------- tamper-evident audit (demo hash, FNV-1a 64-bit style) ---------------- */
  function fnv(str) {
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
      h2 = Math.imul(h2 ^ (c + i), 2246822519) >>> 0;
    }
    return (h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0'));
  }
  function now() {
    const d = new Date();
    return d.toTimeString().slice(0, 8);
  }
  function audit(actor, kind, msg) {
    const prev = S.audit.length ? S.audit[S.audit.length - 1].hash : '0'.repeat(16);
    const ts = now();
    const hash = fnv(prev + ts + actor + kind + msg);
    S.audit.push({ ts, actor, kind, msg, hash, prev });
    if (S.view === 'approvals') renderApprovals();
  }

  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  /* ---------------- step builders ---------------- */
  function codeArtifacts(sc) {
    const t = sc.tables;
    const src = sc.sources[0];
    const dbt = `-- models/silver/${t.silver}.sql  (generated by Data Engineer agent, branch feat/${sc.id})
{{ config(materialized='incremental', unique_key='${sc.id === 'energy' ? 'cell_id, hour_ts' : sc.id === 'b2b' ? 'circuit_id, day' : 'entity_key, period'}',
          tags=['${sc.product}', 'wp-3']) }}
with src as (
  select * from {{ source('bronze', '${t.bronze}') }}
  {% if is_incremental() %}
  where _ingested_at > (select max(_ingested_at) from {{ this }})
  {% endif %}
),
dedup as (
  select *, row_number() over (partition by _business_key order by _commit_ts desc) as rn
  from src
)
select
  ${sc.rules.map((r) => '-- ' + r).join('\n  ')}
  _business_key as entity_key,
  date_trunc('${sc.id === 'energy' ? 'hour' : 'month'}', event_ts) as period,
  ${sc.metrics.map((m) => `/* ${m.n}: ${m.d} */`).join('\n  ')}
  current_timestamp() as _built_at
from dedup where rn = 1`;
    const tests = `# models/silver/${t.silver}.yml
version: 2
models:
  - name: ${t.silver}
    description: "${sc.name} — silver, conformed to TM Forum SID"
    tests:
${sc.dq.map((d, i) => `      - dq_rule:   # DQ-${String(i + 1).padStart(3, '0')}\n          rule: "${d}"\n          severity: ${i === 0 ? 'error' : 'warn'}`).join('\n')}`;
    const ingest = src.ingest.includes('GoldenGate')
      ? `-- ingest/goldengate/${sc.id}/replicat.prm  (values by reference, no secrets)
REPLICAT R${sc.id.toUpperCase().slice(0, 4)}
TARGETDB LIBFILE libggjava.so SET property=dirprm/iceberg.props
MAP ${src.obj.split(',')[0].trim()}, TARGET lake_raw.${src.obj.split(',')[0].trim().toLowerCase()},
    KEYCOLS (/* confirmed at G2 */), COLMAP (USEDEFAULTS);`
      : `# ingest/feeds/${sc.id}_${src.sys.split(' ')[0].toLowerCase()}.yaml
feed: ${sc.id}_${src.sys.split(' ')[0].toLowerCase()}
source: { system: "${src.sys}", objects: "${src.obj}" }
pattern: "${src.ingest}"
target: { catalog: glue, table: lake_raw.${t.bronze.replace('brz_', '')}, format: iceberg }
watermark: _commit_ts
reconcile: { counts: true, control_totals: true }
classification: "${src.cls}"`;
    return { dbt, tests, ingest };
  }

  function contractYaml(sc) {
    return `# 09-publish/${sc.product}.odcs.yaml  (Open Data Contract Standard)
apiVersion: v3.0.0
kind: DataContract
id: ${sc.product}
version: 1.0.0
domain: "${sc.domain}"
owner: "${DC.ROLES.PO.person} (Data Product Owner)"
steward: "${DC.ROLES.STEW.person}"
outputPorts:
  - name: ${sc.tables.gold}
    type: table
  - name: SEMANTIC.${sc.product.replace('dp_', '')}
    type: semantic_view
sla:
  freshness: "${sc.sources.some((s) => s.ingest.includes('Streaming')) ? '15 minutes' : 'daily by 06:00'}"
  availability: 99.5%
quality:
${sc.dq.map((d) => `  - "${d}"`).join('\n')}
consumers: [${sc.consumers.map((c) => `"${c}"`).join(', ')}]
classification: ${sc.sources.some((s) => s.cls.includes('Restricted')) ? 'Restricted (masked views only)' : 'Confidential'}`;
  }

  function semanticYaml(sc) {
    return `# 08-semantic/${sc.product}.semantic.yaml
semantic_view: SEMANTIC.${sc.product.replace('dp_', '')}
base_table: GOLD.${sc.tables.gold}
metrics:
${sc.metrics.map((m) => `  - name: ${m.n}\n    description: "${m.d}"\n    glossary: "${m.n.replace(/_/g, ' ')}"`).join('\n')}
verified_questions:
${sc.cqs.map((q, i) => `  - id: VQ-${String(i + 1).padStart(2, '0')}\n    question: "${q}"`).join('\n')}
agent_instructions: |
  Answer only from this semantic view. Show the SQL and lineage.
  Refuse requests for personal identifiers. Never propose an action without a named approver.`;
  }

  function buildSteps(sc) {
    const c = codeArtifacts(sc);
    const steps = [
      { agent: 'Delivery Orchestrator', lines: [`Intake received from ${sc.sponsor}: "${sc.ask.slice(0, 90)}…"`, 'Validating stack profile: Oracle/Db2 + GoldenGate → S3 Iceberg → Snowflake + dbt Core → semantic layer', `Routing to Build plane. Domain pack: ${sc.domain}. Data product id: ${sc.product}`, 'Plan: 10 stages, 10 human gates, est. agent effort ' + sc.agentWeeks + ' weeks vs ' + sc.baselineWeeks + ' weeks baseline'], gate: 'G0',
        art: { name: '00-intake/brief.md', lang: 'md', body: `# Intake brief\nSponsor: ${sc.sponsor}\nAsk: ${sc.ask}\nOutcome: ${sc.metrics[0].d}\nConsumers: ${sc.consumers.join(', ')}` } },
      { agent: 'Business Analyst', lines: ['Extracting business rules and consumer questions from the ask and domain pack', ...sc.rules.map((r) => 'Drafted ' + r), ...sc.cqs.map((q, i) => `CQ-${String(i + 1).padStart(3, '0')} "${q}"`), 'NFR-001 freshness, NFR-002 retention 24 months, NFR-003 masking for Restricted classes'], gate: 'G1',
        art: { name: '01-requirements/requirements.md', lang: 'md', body: sc.rules.join('\n') + '\n\n' + sc.cqs.map((q, i) => `CQ-${String(i + 1).padStart(3, '0')}: ${q}`).join('\n') } },
      { agent: 'Source Mapping Analyst', lines: ['Reading source metadata only (catalog views, no business rows)', ...sc.sources.map((s) => `${s.sys}: ${s.obj} → ingest "${s.ingest}", class ${s.cls}`), 'Mapped entities to TM Forum SID: Customer, Product, Service, Resource, Usage', ...sc.dq.map((d, i) => `DQ-${String(i + 1).padStart(3, '0')} ${d}`)], gate: 'G2', gov: 'Governance & Lineage: pulled 37 glossary terms; proposed 4 new terms as drafts for the Data Steward',
        art: { name: '02-mapping/source-inventory.csv', lang: 'csv', body: 'system,objects,ingest_pattern,classification\n' + sc.sources.map((s) => `"${s.sys}","${s.obj}","${s.ingest}","${s.cls}"`).join('\n') } },
      { agent: 'Solution Architect', lines: [`Medallion design: ${sc.tables.bronze} → ${sc.tables.silver} → ${sc.tables.gold}`, 'ADR-001 Lake tables stay in Glue; Snowflake reads via catalog-linked database', 'ADR-002 Silver/gold as native tables; ADR-003 dbt Core in Git, scheduled by client orchestrator', 'Cost estimate: XS warehouse 2.1 h/day ≈ 4.2 credits/day; S3 + Glue ≈ €140/month', `Data product boundary: output ports ${sc.tables.gold} + semantic view`], gate: 'G3', gov: 'Governance & Lineage: registered 3 candidate data sets and 41 columns in the catalog',
        art: { name: '03-design/adr-001.md', lang: 'md', body: '# ADR-001 Lake placement\nStatus: proposed\nDecision: keep raw Iceberg in Glue; Snowflake catalog-linked database; bronze = thin views.\nConsequence: one copy of raw data; freshness bounded by Glue commit.' } },
      { agent: 'Data Engineer', lines: ['WP-1 ingest: generated ' + sc.sources.length + ' feed configs / replicat files', 'WP-2 lake-to-bronze: catalog integration DDL + bronze views', `WP-3 dbt: 3 staging, 2 silver, 1 gold model, ${sc.dq.length} tests`, 'Ran dbt build in dev sandbox on synthetic data: 14 models, 22 tests passed', `Opened PR #${210 + DC.BUILD_SCENARIOS.indexOf(sc)} feat/${sc.id} (+1,284 / −0)`], gate: 'G4',
        art: [{ name: `models/silver/${sc.tables.silver}.sql`, lang: 'sql', body: c.dbt }, { name: `models/silver/${sc.tables.silver}.yml`, lang: 'yaml', body: c.tests }, { name: 'ingest config', lang: 'yaml', body: c.ingest }] },
      { agent: 'Quality Engineer', lines: ['Hop reconciliation: source → raw 100.00%, raw → bronze 100.00%, bronze → silver 99.98% (dedup explained), silver → gold 100.00%', 'Change-capture tests: insert / update / delete / late arrival / duplicate: 5 of 5 pass', 'Idempotency: second dbt build produced 0 changed rows', 'Masking verified for 4 roles; cross-domain read denied as expected', 'Mutation check: 3 of 3 seeded defects caught'], gate: 'G5',
        art: { name: '05-test/evidence.md', lang: 'md', body: '| Hop | Rows | Control total | Result |\n|---|---|---|---|\n| source→raw | 1,204,331 | 88,412,903.17 | match |\n| raw→bronze | 1,204,331 | 88,412,903.17 | match |\n| bronze→silver | 1,204,102 | 88,412,903.17 | 229 dupes removed |\n| silver→gold | 52,270 | 2,310,448.00 | match |' } }
    ];
    if (sc.ml) {
      steps.push({ agent: 'ML Engineer', lines: [`Building feature set from certified gold: ${sc.ml.features}`, `Training ${sc.ml.model}, target = ${sc.ml.target}`, `Holdout result: ${sc.ml.metric}`, 'Bias test across region, age band and tenure: max gap 2.1 pts (threshold 5)', 'Excluded restricted features: none used. Model card MC-' + (7 + DC.BUILD_SCENARIOS.indexOf(sc)) + ' written'], gate: 'G6',
        art: { name: 'ml/model-card.md', lang: 'md', body: `# Model card\nModel: ${sc.ml.model}\nTarget: ${sc.ml.target}\nFeatures: ${sc.ml.features}\nPerformance: ${sc.ml.metric}\nIntended use: decision support; a person approves every customer-facing action.\nNot for: credit or legal decisions.` } });
    }
    steps.push(
      { agent: 'Release Engineer', lines: ['Release bundle R-' + sc.id + '-1.0: (1) lake + replication files for platform team, (2) Snowflake objects + roles, (3) dbt project, (4) lake maintenance jobs', 'Tested commit 7f3c2e1 = deploy commit 7f3c2e1', 'Rollback rehearsed in test: 3 min 40 s', 'Change request CHG-' + (55100 + DC.BUILD_SCENARIOS.indexOf(sc)) + ' raised for CAB'], gate: 'G7', gov: 'Governance & Lineage: lineage completeness 100% on contract columns (31 scanned, 6 custom-declared)',
        art: { name: '06-release/runbook.md', lang: 'md', body: 'Order: lake → snowflake → dbt → maintenance\nVerify after each part; rollback = previous tag + drop new objects in reverse order.' } },
      { agent: 'Semantic & AI Context', lines: [`Semantic view SEMANTIC.${sc.product.replace('dp_', '')} with ${sc.metrics.length} certified metrics`, `Verified questions: ${sc.cqs.length} of ${sc.cqs.length} answer correctly vs reference SQL`, 'Out-of-scope test: refused correctly. PII request: refused correctly. Access-denied per role: pass', 'AI context corpus: glossary, requirements, contract (no unapproved docs)'], gate: 'G8',
        art: { name: '08-semantic/semantic.yaml', lang: 'yaml', body: semanticYaml(sc) } },
      { agent: 'Data Product Publisher', lines: ['Contract v1.0.0 (ODCS) drafted from approved artifacts', 'Listing prepared for internal marketplace + catalog marketplace', 'Publication checklist: 9 of 9 present', 'Operate onboarding pack written: environment, signals, kedb seed, proposed actions'], gate: 'G9',
        art: [{ name: `09-publish/${sc.product}.odcs.yaml`, lang: 'yaml', body: contractYaml(sc) }, { name: '07-operations/operate/signals.fragment.yaml', lang: 'yaml', body: `signals:\n  - feed_lag: { source: "${sc.sources[0].sys}", threshold_min: 30 }\n  - dbt_run_results: { project: ${sc.product}, on_fail: page_AMS }\n  - freshness: { table: ${sc.tables.gold}, sla: contract }\n  - semantic_eval: { schedule: weekly, min_accuracy: 0.95 }` }] }
    );
    return steps;
  }

  function operateSteps(sc) {
    const steps = [
      { agent: 'Watch Desk', lines: sc.signals.map((s) => `[${s[0]}] ${s[1]}: ${s[2]}`) },
      { agent: 'Triage & Correlation', lines: [sc.correlation, `Autonomy for this scenario today: ${sc.autonomyFrom}. Target after validation: ${sc.autonomyTo}`] },
      { agent: 'Diagnosis (RCA)', lines: sc.hypotheses.map((h) => `${Math.round(h.conf * 100)}%  ${h.h}\n      evidence: ${h.ev}`) },
      { agent: 'Resolution', lines: sc.actions.map((a) => `${a.id} [${a.cls}] ${a.desc}\n      blast radius: ${a.blast} · rollback: ${a.rollback} · verify: ${a.verify}`), gate: 'ACT',
        art: { name: 'action-plan.yaml', lang: 'yaml', body: 'actions:\n' + sc.actions.map((a) => `  - id: ${a.id}\n    class: ${a.cls}\n    do: "${a.desc}"\n    approvers: [${a.approvers.map((r) => DC.ROLES[r].title).join(', ')}]\n    rollback: "${a.rollback}"\n    verify: "${a.verify}"`).join('\n') } },
      { agent: 'Resolution', lines: ['Executing approved actions through the runbook runner (scoped credentials, time-boxed)', sc.verify] },
      { agent: 'Comms', lines: ['Drafted stakeholder update:', sc.comms], gate: 'COMMS' },
      { agent: 'Problem & Knowledge', lines: ['Drafted known-error entry:', sc.kedb], gate: 'KEDB' },
      { agent: 'Service Reporting', lines: [`MTTD ${sc.metrics.mttd} · MTTR ${sc.metrics.mttr} (baseline ${sc.metrics.baseline}) · events ${sc.metrics.alarms}`, 'Incident closed. Report added to the weekly service review.'] }
    ];
    return steps;
  }

  /* ---------------- run engine ---------------- */
  function newRun(plane) {
    const sc = plane === 'build' ? DC.BUILD_SCENARIOS.find((s) => s.id === S.sel.build) : DC.OPERATE_SCENARIOS.find((s) => s.id === S.sel.operate);
    const steps = plane === 'build' ? buildSteps(sc) : operateSteps(sc);
    stopRun(plane);
    S.runs[plane] = { id: plane[0].toUpperCase() + '-' + (++S.seq), plane, sc, steps, i: 0, li: 0, log: [], arts: [], status: 'running', timer: null, started: Date.now(), gatesDone: 0, waitingFor: null, revisions: 0 };
    log(plane, 'sys', 'Runtime', `Run ${S.runs[plane].id} started: ${sc.name}`);
    audit('Runtime', 'run.start', `${plane} ${S.runs[plane].id} ${sc.name}`);
    tick(plane);
    rerender();
  }
  function stopRun(plane) {
    const r = S.runs[plane];
    if (r && r.timer) clearTimeout(r.timer);
  }
  function log(plane, kind, who, msg) {
    const r = S.runs[plane];
    if (!r) return;
    r.log.push({ t: now(), kind, who, msg });
    const con = document.getElementById('console-' + plane);
    if (con && S.view === plane) {
      if (con.querySelector('.empty')) con.innerHTML = '';
      con.insertAdjacentHTML('beforeend', lineHTML(r.log[r.log.length - 1]));
      con.scrollTop = con.scrollHeight;
    }
  }
  function lineHTML(l) {
    const cls = l.kind === 'gate' ? 'gate' : l.kind === 'ok' ? 'ok' : l.kind === 'bad' ? 'bad' : '';
    const whoCls = l.kind === 'human' || l.kind === 'ok' || l.kind === 'bad' ? 'h' : l.kind === 'sys' || l.kind === 'gate' ? 'sys' : '';
    return `<div class="ln ${cls}"><span class="t">${esc(l.t)}</span><span class="who ${whoCls}">${esc(l.who)}</span><span class="msg">${esc(l.msg)}</span></div>`;
  }
  function tick(plane) {
    const r = S.runs[plane];
    if (!r || r.status !== 'running') return;
    const step = r.steps[r.i];
    if (!step) { finishRun(plane); return; }
    if (r.li < step.lines.length) {
      log(plane, 'agent', step.agent, step.lines[r.li]);
      r.li++;
      r.timer = setTimeout(() => tick(plane), 420 / S.speed);
      if (S.view === plane) renderStages(plane);
      return;
    }
    if (step.gov && !step._govDone) { step._govDone = true; log(plane, 'agent', 'Governance & Lineage', step.gov.replace('Governance & Lineage: ', '')); r.timer = setTimeout(() => tick(plane), 420 / S.speed); return; }
    if (step.art && !step._artDone) {
      step._artDone = true;
      (Array.isArray(step.art) ? step.art : [step.art]).forEach((a) => r.arts.push(Object.assign({ by: step.agent }, a)));
      if (S.view === plane) renderArtifacts(plane);
    }
    if (step.gate && !step._gateDone) {
      raiseGate(plane, step);
      return;
    }
    r.i++; r.li = 0;
    r.timer = setTimeout(() => tick(plane), 300 / S.speed);
    if (S.view === plane) renderStages(plane);
  }

  function gateSpec(plane, step, r) {
    if (plane === 'build') {
      const g = DC.BUILD_GATES[step.gate];
      return { gate: step.gate, title: `${step.gate} · ${g.name}`, approvers: g.approvers.slice(), checks: g.check, cls: step.gate === 'G7' || step.gate === 'G9' ? 'A3' : 'A1' };
    }
    const sc = r.sc;
    if (step.gate === 'ACT') {
      const roles = [...new Set(sc.actions.flatMap((a) => a.approvers))];
      return { gate: 'ACT', title: 'Approve action plan', approvers: roles, checks: ['Blast radius stated per action', 'Rollback defined per action', 'Verification check defined', 'Change record linked for A3'], cls: sc.actions.some((a) => a.cls === 'A3') ? 'A3' : 'A2' };
    }
    if (step.gate === 'COMMS') return { gate: 'COMMS', title: 'Approve stakeholder message', approvers: sc.commsApprovers.slice(), checks: ['Facts match incident timeline', 'No speculation on cause', 'Plain language'], cls: 'A3' };
    return { gate: 'KEDB', title: 'Approve known-error entry', approvers: ['PRB'], checks: ['Root cause evidenced', 'Pre-check is read-only', 'Linked to incident'], cls: 'A1' };
  }

  function raiseGate(plane, step) {
    const r = S.runs[plane];
    const spec = gateSpec(plane, step, r);
    const version = (step._ver || 0) + 1; step._ver = version;
    const evidence = r.arts.slice(-3).map((a) => a.name).join(', ') || 'agent log';
    const id = `${r.id}-${spec.gate}-v${version}`;
    const hash = fnv(id + evidence + r.log.length);
    const ap = { id, plane, runId: r.id, step, gate: spec.gate, title: spec.title, scenario: r.sc.name, approvers: spec.approvers, signed: {}, status: 'pending', checks: spec.checks, evidence, hash, version, cls: spec.cls, raisedAt: now(), comment: '' };
    S.approvals.unshift(ap);
    r.status = 'waiting'; r.waitingFor = ap.id;
    log(plane, 'gate', 'Gate', `${spec.title} → waiting for ${spec.approvers.map((k) => DC.ROLES[k].title).join(' + ')}. Bound to hash ${hash}`);
    audit(step.agent, 'gate.request', `${ap.id} ${spec.title} hash=${hash}`);
    updateBadge();
    rerender();
    if (S.autoApprove) autoSign(ap);
  }

  function autoSign(ap) {
    let delay = 900 / S.speed;
    ap.approvers.forEach((role) => {
      setTimeout(() => { if (ap.status === 'pending') sign(ap.id, role, true); }, delay);
      delay += 700 / S.speed;
    });
  }

  function sign(apId, role, simulated) {
    const ap = S.approvals.find((a) => a.id === apId);
    if (!ap || ap.status !== 'pending' || ap.signed[role]) return;
    if (!ap.approvers.includes(role)) { toast(`${DC.ROLES[role].title} is not an approver for this gate.`); return; }
    ap.signed[role] = now();
    const person = DC.ROLES[role].person;
    log(ap.plane, 'human', `${person}`, `Signed ${ap.title} as ${DC.ROLES[role].title}${simulated ? ' (simulated approver)' : ''}`);
    audit(`${person} (${DC.ROLES[role].title})`, 'gate.sign', `${ap.id} hash=${ap.hash}`);
    if (ap.approvers.every((k) => ap.signed[k])) {
      ap.status = 'approved';
      ap.step._gateDone = true;
      const r = S.runs[ap.plane];
      log(ap.plane, 'ok', 'Gate', `${ap.title} approved by ${ap.approvers.length} of ${ap.approvers.length}. Continuing.`);
      audit('Runtime', 'gate.approved', ap.id);
      if (r && r.waitingFor === ap.id) { r.status = 'running'; r.gatesDone++; r.waitingFor = null; r.i++; r.li = 0; r.timer = setTimeout(() => tick(ap.plane), 350 / S.speed); }
      if (ap.onApprove) ap.onApprove();
    }
    updateBadge();
    rerender();
  }

  function decide(apId, decision, comment) {
    const ap = S.approvals.find((a) => a.id === apId);
    if (!ap || ap.status !== 'pending') return;
    const r = S.runs[ap.plane];
    ap.comment = comment || '';
    const actor = 'Reviewer';
    if (decision === 'reject') {
      ap.status = 'rejected';
      log(ap.plane, 'bad', actor, `Rejected ${ap.title}${comment ? ': ' + comment : ''}. Run stopped; nothing was deployed.`);
      audit(actor, 'gate.reject', `${ap.id} ${comment}`);
      if (r && r.waitingFor === ap.id) { r.status = 'rejected'; r.waitingFor = null; }
    } else {
      ap.status = 'changes';
      log(ap.plane, 'bad', actor, `Requested changes on ${ap.title}: ${comment || 'see review comment'}`);
      audit(actor, 'gate.changes', `${ap.id} ${comment}`);
      if (r && r.waitingFor === ap.id && r.revisions < 3) {
        r.revisions++;
        const step = ap.step;
        const agent = step.agent;
        r.status = 'running'; r.waitingFor = null;
        setTimeout(() => {
          log(ap.plane, 'agent', agent, `Revision ${step._ver + 1}: addressed reviewer comment "${comment || 'general'}". Re-ran checks; diff attached to the gate.`);
          raiseGate(ap.plane, step);
        }, 900 / S.speed);
      } else if (r && r.waitingFor === ap.id) {
        r.status = 'rejected';
        log(ap.plane, 'bad', 'Runtime', 'Return limit (3) reached. Escalated to the Data Product Owner.');
      }
    }
    updateBadge();
    rerender();
  }

  function finishRun(plane) {
    const r = S.runs[plane];
    r.status = 'done';
    log(plane, 'ok', 'Runtime', plane === 'build'
      ? `Delivered ${r.sc.product}: published to the internal marketplace and handed to Operate. ${r.gatesDone} human gates passed.`
      : `Incident closed. ${r.gatesDone} human decisions recorded.`);
    audit('Runtime', 'run.done', `${r.id}`);
    rerender();
  }

  /* ---------------- consume actions → approvals ---------------- */
  function raiseConsumeAction(ans) {
    const a = ans.action;
    const id = `C-${++S.seq}-ACTION`;
    const hash = fnv(id + a.title);
    const ap = { id, plane: 'consume', runId: 'C-' + S.seq, step: { agent: 'Next-Best-Action' }, gate: a.cls, title: a.title, scenario: ans.q, approvers: a.approvers.slice(), signed: {}, status: 'pending', checks: a.checks, evidence: a.value, hash, version: 1, cls: a.cls, raisedAt: now(), comment: '' };
    ap.onApprove = () => {
      S.chat.push({ type: 'sys', text: `Approved by ${ap.approvers.map((k) => DC.ROLES[k].person).join(' and ')}. Handed to the runtime for execution with the approved content and audience (hash ${hash}).` });
      if (S.view === 'consume') renderConsume();
    };
    S.approvals.unshift(ap);
    audit('Next-Best-Action', 'gate.request', `${id} ${a.title} hash=${hash}`);
    updateBadge();
    toast('Action sent for approval. See Approvals.');
    if (S.autoApprove) autoSign(ap);
    return ap;
  }

  /* ---------------- rendering helpers ---------------- */
  function rerender() { render(S.view, true); }
  function updateBadge() {
    const n = S.approvals.filter((a) => a.status === 'pending').length;
    const b = document.getElementById('badge-approvals');
    if (b) { b.textContent = n; b.hidden = n === 0; }
  }
  function roleChip(k) { return `<span class="tag">${esc(DC.ROLES[k].title)}</span>`; }

  function gateCardHTML(ap, compact) {
    const state = ap.status === 'approved' ? 'approved' : ap.status === 'rejected' ? 'rejected' : ap.status === 'changes' ? 'changes' : '';
    const statusTag = { pending: '<span class="tag warn">Waiting for people</span>', approved: '<span class="tag ok">Approved</span>', rejected: '<span class="tag crit">Rejected</span>', changes: '<span class="tag operate">Changes requested</span>' }[ap.status];
    const signers = ap.approvers.map((k) => {
      const R = DC.ROLES[k];
      const signed = ap.signed[k];
      return `<div class="signer ${signed ? 'signed' : ''}"><span class="who"><b>${esc(R.person)}</b><small>${esc(R.title)}</small></span>${signed ? `<span class="tag ok">Signed ${esc(signed)}</span>` : ap.status === 'pending' ? `<button class="btn sm ok" data-sign="${esc(ap.id)}" data-role="${k}">Approve as ${esc(R.title)}</button>` : ''}</div>`;
    }).join('');
    const controls = ap.status === 'pending' ? `<div class="row"><input type="text" id="cmt-${esc(ap.id)}" placeholder="Review comment (needed for changes or reject)" style="flex:1;min-width:180px"><button class="btn sm" data-changes="${esc(ap.id)}">Request changes</button><button class="btn sm danger" data-reject="${esc(ap.id)}">Reject</button></div>` : ap.comment ? `<p class="sub">Comment: ${esc(ap.comment)}</p>` : '';
    return `<div class="gate-card ${state}">
      <div class="gate-top"><span class="tag ${ap.plane}">${esc(ap.plane)}</span><h4>${esc(ap.title)}</h4><span class="tag cls">${esc(ap.cls)}</span>${statusTag}</div>
      ${compact ? '' : `<p class="sub">${esc(ap.scenario)} · raised by ${esc(ap.step.agent)} at ${esc(ap.raisedAt)} · version ${ap.version}</p>`}
      <div class="checks">${ap.checks.map((c) => `<div>${esc(c)}</div>`).join('')}</div>
      <p class="sub">Evidence: ${esc(ap.evidence)}</p>
      <div class="signers">${signers}</div>
      ${controls}
      <span class="hash">Approval bound to content hash ${esc(ap.hash)}. Any change to the evidence creates a new version and needs new signatures.</span>
    </div>`;
  }

  /* ---------------- views ---------------- */
  const VIEWS = {};

  VIEWS.overview = function () {
    const plane = (key, title, lede, list, n) => `<div class="panel plane-card" style="--plane:${PLANE_VAR[key]}"><div class="stack">
      <span class="eyebrow">${n} agents</span><h3>${title}</h3><p class="sub">${lede}</p>
      <ul class="bul">${list.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <a href="#${key}" class="btn primary" style="align-self:flex-start;text-decoration:none">Open ${title}</a></div></div>`;
    return `<div class="page">
      <div class="page-head"><span class="eyebrow">NorthStar Telecom · demo tenant · synthetic data</span>
        <h1>One agent workforce for telco data and AI, with people deciding every gate</h1>
        <p class="lede">Build agents turn a business ask into a governed data product. Operate agents keep it, and the network behind it, running. Consume agents put certified answers and actions in front of the business. Every step that changes something waits for a named person.</p></div>
      ${flowSVG()}
      <div class="planes">
        ${plane('build', 'Build with AI', 'From business request to a published, AI-ready data product.', ['Requirements, SID mapping, PII classification', 'Medallion design, dbt + ingest code, tests', 'Model training with model card and bias test', 'Semantic layer, contract, marketplace listing'], DC.AGENTS.build.length)}
        ${plane('operate', 'Operate with AI', 'Agentic NOC and DataOps: from alarm storm to approved fix.', ['Alarm correlation and impact scoring', 'Root cause with evidence and confidence', 'Runbook actions with blast radius + rollback', 'Comms, known-error entries, service reports'], DC.AGENTS.operate.length)}
        ${plane('consume', 'Consume with AI', 'Certified answers and actions for business teams.', ['Ask-your-data on the semantic layer only', 'Insight and next-best-action proposals', 'Care copilot and enterprise account briefs', 'Every action routed to a named approver'], DC.AGENTS.consume.length)}
      </div>
      <div class="kpis">
        <div class="kpi"><b>12 → 3 wks</b><span>Request to data product (churn slice, illustrative target)</span></div>
        <div class="kpi"><b>236 → 1</b><span>Alarms compressed into one incident (simulated)</span></div>
        <div class="kpi"><b>${Object.keys(DC.ROLES).length}</b><span>Named human roles that approve agent output</span></div>
        <div class="kpi"><b>A0–A4</b><span>Action classes; A4 is never done by an agent</span></div>
      </div>
      <p class="note">Figures on this page are simulated for the demo. Validate them in a pilot with your own baseline before quoting them.</p>
      <div class="panel"><div class="panel-head"><h2>Coverage across telco domains</h2><span class="sub">Where each plane does work in each domain</span></div>
        <div class="table-wrap"><table class="domain-table"><thead><tr><th>Domain</th><th style="color:var(--build)">Build</th><th style="color:var(--operate)">Operate</th><th style="color:var(--consume)">Consume</th></tr></thead>
        <tbody>${DC.DOMAINS.map((d) => `<tr><td>${esc(d.name)}</td><td>${esc(d.build)}</td><td>${esc(d.operate)}</td><td>${esc(d.consume)}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="grid g2">
        <div class="panel"><div class="panel-head"><h2>Action classes</h2><span class="sub">Same rules in all three planes</span></div>
          <table><tbody>${DC.ACTION_CLASSES.map((a) => `<tr><td><span class="tag cls">${a.id}</span></td><td><b>${a.name}</b><br><span class="sub">${esc(a.desc)}</span></td><td class="sub">${esc(a.approval)}</td></tr>`).join('')}</tbody></table></div>
        <div class="panel"><div class="panel-head"><h2>How to run the demo</h2></div>
          <ol class="bul" style="padding-left:20px">
            <li><b>Build:</b> pick a use case, press Run, and approve each gate as the named role. Try “Request changes” to see the agent revise and re-raise the gate with a new hash.</li>
            <li><b>Operate:</b> run the RAN incident. Approve the rollback as NOC Shift Lead and Change Manager, then the customer message and the known-error entry.</li>
            <li><b>Consume:</b> ask as the CCO, then send the retention offer for approval.</li>
            <li><b>Approvals:</b> see every pending decision by role, and the hash-chained audit trail.</li>
          </ol>
          <label class="toggle" style="margin-top:12px"><input type="checkbox" id="auto2" ${S.autoApprove ? 'checked' : ''}> Simulated approvers sign automatically (for a fast walkthrough)</label></div>
      </div>
    </div>`;
  };

  function flowSVG() {
    // Three planes feeding each other: Build → Operate → Consume → (new asks) → Build
    return `<div class="panel" style="padding:12px"><svg class="flow-svg" viewBox="0 0 960 190" role="img" aria-label="Flow: business ask to Build, handover to Operate, certified data to Consume, new asks back to Build. Human gates on every path.">

  function runView(plane) {
    const isB = plane === 'build';
    const list = isB ? DC.BUILD_SCENARIOS : DC.OPERATE_SCENARIOS;

    const selId = S.sel[plane];

    const agents = DC.AGENTS[plane];
    const pending = S.approvals.filter((a) => a.plane === plane && r && a.runId === r.id);

    const elapsed = r ? Math.round((Date.now() - r.started) / 1000) : 0;
    const statusTag = !r ? '<span class="tag">Not started</span>' : { running: '<span class="tag build">Agents working</span>', waiting: '<span class="tag warn">Waiting for a person</span>', done: '<span class="tag ok">Complete</span>', rejected: '<span class="tag crit">Stopped by reviewer</span>' }[r.status];

        <p class="lede">${isB ? 'Eleven agents do the engineering work. Ten gates stop the run until the named people sign. Approvals are bound to the evidence hash, so nothing changes after a signature without a new review.' : 'Nine agents watch, correlate, diagnose and propose. Production actions (A3) need two people and a rollback. Customer messages and knowledge entries are approved too.'}</p></div>

            <div class="stat"><b>${r.revisions}</b><span>Revisions requested</span></div>

            </tbody></table></div></div>
        </div>
      </div></div>`;
  }

  function buildMeta(sc) {
    return `<div class="grid g3">
      <div><h4>Sources</h4><ul class="clean sub">${sc.sources.map((s) => `<li>${esc(s.sys)} <span class="tag ${s.cls.includes('Restricted') ? 'crit' : ''}">${esc(s.cls)}</span></li>`).join('')}</ul></div>

  }
  function barSVG(a, b) {
    const max = Math.max(a, b), w = 190;

      <rect x="70" y="6" width="${(a / max) * w * 0.8}" height="16" rx="3" fill="var(--muted)" opacity="0.45"/><text x="0" y="18" font-size="11" fill="var(--muted)">Baseline</text><text x="${74 + (a / max) * w * 0.8}" y="18" font-size="11" fill="var(--ink)">${a}w</text>
      <rect x="70" y="30" width="${(b / max) * w * 0.8}" height="16" rx="3" fill="var(--build)"/><text x="0" y="42" font-size="11" fill="var(--muted)">Agents</text><text x="${74 + (b / max) * w * 0.8}" y="42" font-size="11" fill="var(--ink)">${b}w</text></svg>`;

  function operateMeta(sc) {

  function stagesHTML(plane) {
    const r = S.runs[plane];
    const list = plane === 'build' ? DC.BUILD_SCENARIOS : DC.OPERATE_SCENARIOS;
    const sc = list.find((s) => s.id === S.sel[plane]);

      let cls = '';
      if (r && r.sc.id === sc.id) {
        if (i < r.i || r.status === 'done') cls = 'done';
        else if (i === r.i) cls = r.status === 'waiting' ? 'wait' : r.status === 'rejected' ? 'rej' : 'active';
      }
      const g = st.gate ? (plane === 'build' ? st.gate : { ACT: 'approve', COMMS: 'approve', KEDB: 'approve' }[st.gate]) : '—';
      return `<div class="stage ${cls}"><span class="g">${esc(g)}</span><b>${esc(st.agent)}</b></div>`;
    }).join('');
  }
  function artsHTML(plane) {
    const r = S.runs[plane];
    if (!r || r.sc.id !== S.sel[plane] || !r.arts.length) return '<p class="sub">No artifacts yet.</p>';
    return r.arts.slice().reverse().map((a, i) => `<details class="art" ${i === 0 ? 'open' : ''}><summary><span class="tag cls">${esc(a.lang)}</span>${esc(a.name)}<span class="sub">${esc(a.by)}</span></summary><pre class="code">${esc(a.body)}</pre></details>`).join('');
  }
  function renderStages(plane) { const el = document.getElementById('stages-' + plane); if (el) el.innerHTML = stagesHTML(plane); }
  function renderArtifacts(plane) { const el = document.getElementById('arts-' + plane); if (el) el.innerHTML = artsHTML(plane); }

  VIEWS.build = () => runView('build');
  VIEWS.operate = () => runView('operate');

  VIEWS.consume = function () {
    const p = DC.PERSONAS.find((x) => x.id === S.sel.persona);
    const qs = DC.ANSWERS.filter((a) => a.p === p.id);
    return `<div class="page" style="--plane:var(--consume)">
      <div class="page-head"><span class="eyebrow">Consume with AI · business self-service</span>
        <h1>Certified answers, with the SQL, lineage and an approver for every action</h1>
        <p class="lede">The assistant reads only the semantic layer that Build certified at gate G8. It shows how each number was computed, masks personal data by role, and turns insight into an action that a named person approves.</p></div>
      <div class="chat-layout">
        <div class="stack">
          <h4>Ask as</h4>
          ${DC.PERSONAS.map((x) => `<button class="persona" data-persona="${x.id}" aria-pressed="${x.id === p.id}"><b>${esc(x.title)}</b><small>${esc(x.product)}</small></button>`).join('')}
          <div class="panel" style="padding:12px"><h4>Consume agents</h4><ul class="clean sub" style="margin-top:6px">${DC.AGENTS.consume.map((a) => `<li><b>${esc(a.name)}</b> <span class="tag cls">${a.cls}</span><br>${esc(a.role)}</li>`).join('')}</ul></div>
        </div>
        <div class="panel stack" style="min-width:0">
          <div class="chat" id="chat">${S.chat.length ? S.chat.map(chatHTML).join('') : `<div class="empty-state">Pick a question below or type your own. Try a question that asks for phone numbers to see the guardrail.</div>`}</div>
          <div class="suggest">${qs.map((a) => `<button class="chip" data-ask="${esc(a.q)}">${esc(a.q)}</button>`).join('')}<button class="chip" data-ask="Give me the phone numbers of customers likely to churn">Give me the phone numbers of customers likely to churn</button></div>
          <form class="ask-bar" id="ask-form"><input type="text" id="ask-input" placeholder="Ask a business question…" autocomplete="off" aria-label="Question"><button class="btn primary" type="submit">Ask</button></form>

  function chatHTML(m) {
    if (m.type === 'u') return `<div class="msg-u">${esc(m.text)}</div>`;
    if (m.type === 'sys') return `<div class="msg-a"><div class="meta"><span class="tag ok">Approval recorded</span></div><p>${esc(m.text)}</p></div>`;
    if (m.type === 'guard') return `<div class="msg-a"><div class="meta"><span class="tag crit">${esc(m.rule)}</span></div><p>${esc(m.text)}</p></div>`;
    const a = m.ans;
    const t = a.table;
    const ap = m.apId ? S.approvals.find((x) => x.id === m.apId) : null;
    return `<div class="msg-a">
      <div class="meta"><span class="tag consume">Ask-Your-Data</span><span class="tag">Confidence: ${esc(a.conf)}</span></div>
      <p>${esc(a.a)}</p>
      <div class="table-wrap"><table><thead><tr>${t[0].map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${t.slice(1).map((r) => `<tr>${r.map((c, i) => `<td class="${i ? 'num' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <details class="art"><summary><span class="tag cls">sql</span>How this was computed<span class="sub">${esc(a.lineage)}</span></summary><pre class="code">${esc(a.sql)}</pre></details>
      ${a.action ? `<div class="action-card"><div class="row"><span class="tag consume">Next-Best-Action</span><span class="tag cls">${a.action.cls}</span><b>${esc(a.action.title)}</b></div>
        <p class="sub">${esc(a.action.value)} · approvers: ${a.action.approvers.map((k) => esc(DC.ROLES[k].title)).join(' + ')}</p>
        ${ap ? `<p>${ap.status === 'approved' ? '<span class="tag ok">Approved</span>' : ap.status === 'pending' ? '<span class="tag warn">Waiting for approval</span> <a href="#approvals">Open approvals</a>' : `<span class="tag crit">${esc(ap.status)}</span>`}</p>` : `<button class="btn primary" style="align-self:flex-start" data-action-q="${esc(a.q)}" data-msg="${m.idx}">Send for approval</button>`}</div>` : ''}
    </div>`;
  }

  function ask(text) {
    const q = text.trim();
    if (!q) return;
    S.chat.push({ type: 'u', text: q });
    const lower = q.toLowerCase();
    const guard = DC.GUARDRAILS.find((g) => g.kw.some((k) => lower.includes(k)));
    if (guard) {
      S.chat.push({ type: 'guard', text: guard.reply, rule: guard.rule });
      audit('Ask-Your-Data', 'guardrail', `${guard.rule}: "${q}"`);
    } else {
      let best = DC.ANSWERS.find((a) => a.q.toLowerCase() === lower);
      if (!best) {
        let score = 0;
        DC.ANSWERS.forEach((a) => {
          const s = a.kw.filter((k) => lower.includes(k)).length + (a.p === S.sel.persona ? 0.5 : 0);
          if (s > score) { score = s; best = a; }
        });
        if (score < 1) best = null;
      }
      if (best) {
        S.chat.push({ type: 'a', ans: best, idx: S.chat.length });
        audit('Ask-Your-Data', 'answer', `${best.q} [${best.conf}]`);
      } else {
        S.chat.push({ type: 'guard', text: 'I could not match that to a certified metric. I have logged it as a candidate consumer question; the Business Analyst agent will propose it as a new CQ at the next Build intake.', rule: 'No certified answer' });
        audit('Ask-Your-Data', 'cq.candidate', q);
      }
    }
    renderConsume();
  }
  function renderConsume() {
    if (S.view !== 'consume') return;
    $('#view').innerHTML = VIEWS.consume();
    const c = $('#chat'); if (c) c.lastElementChild && c.lastElementChild.scrollIntoView({ block: 'nearest' });
  }

  VIEWS.approvals = function () {
    const f = S.sel.roleFilter || 'all';
    const list = S.approvals.filter((a) => f === 'all' || a.approvers.includes(f));

      <div class="page-head"><span class="eyebrow">Human in the loop</span><h1>Approvals and audit trail</h1>
        <p class="lede">One queue for every decision agents cannot take alone, across Build, Operate and Consume. Filter by role to see one person’s queue. Agents never sign; each approval is bound to the hash of the evidence it covers.</p></div>

        <select id="role-filter"><option value="all">All roles</option>${Object.entries(DC.ROLES).map(([k, r]) => `<option value="${k}" ${f === k ? 'selected' : ''}>${esc(r.title)} — ${esc(r.person)}</option>`).join('')}</select>

      ${done.length ? `<div class="stack"><h2>Decided (${done.length})</h2>${done.slice(0, 12).map((a) => gateCardHTML(a, true)).join('')}</div>` : ''}
      <div class="panel"><div class="panel-head"><h2>Audit trail</h2><span class="sub">Each entry hashes the previous one, so a missing or edited row breaks the chain</span></div>
        ${S.audit.length ? `<div class="table-wrap"><table class="audit"><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Detail</th><th>Hash</th></tr></thead><tbody>${S.audit.slice().reverse().slice(0, 80).map((e) => `<tr><td>${esc(e.ts)}</td><td>${esc(e.actor)}</td><td>${esc(e.kind)}</td><td class="msgc">${esc(e.msg)}</td><td>${esc(e.hash)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-state">No events yet.</div>'}
        <p class="note" style="margin-top:8px">Demo uses a non-cryptographic hash. Production uses SHA-256 with signed approvals.</p></div>
      <div class="panel"><div class="panel-head"><h2>Who approves what</h2></div><div class="table-wrap"><table><thead><tr><th>Role</th><th>Person (fictional)</th><th>Team</th><th>Gates and decisions</th></tr></thead><tbody>
        ${Object.entries(DC.ROLES).map(([k, r]) => `<tr><td><b>${esc(r.title)}</b></td><td>${esc(r.person)}</td><td>${esc(r.team)}</td><td class="sub">${esc(rolesGates(k))}</td></tr>`).join('')}</tbody></table></div></div>
    </div>`;
  };
  function rolesGates(k) {
    const g = Object.entries(DC.BUILD_GATES).filter(([, v]) => v.approvers.includes(k)).map(([id]) => id);
    const o = DC.OPERATE_SCENARIOS.flatMap((s) => s.actions.filter((a) => a.approvers.includes(k)).map((a) => a.cls)).filter((v, i, arr) => arr.indexOf(v) === i).map((c) => 'Operate ' + c);
    if (DC.OPERATE_SCENARIOS.some((s) => s.commsApprovers.includes(k))) o.push('Customer comms');
    if (k === 'PRB') o.push('Known-error entries');
    const c = DC.ANSWERS.filter((a) => a.action && a.action.approvers.includes(k)).length ? ['Consume actions'] : [];
    const r = k === 'RES' ? ['Experiment charters', 'Graduation to Build'] : [];
    return [...g.map((x) => 'Build ' + x), ...o, ...c, ...r].join(', ') || '—';
  }

  VIEWS.teams = function () {
