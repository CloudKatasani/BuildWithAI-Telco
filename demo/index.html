<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>DataCrew Telco Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
<!--HEAD-END-->
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#overview" style="text-decoration:none;color:inherit">
      <svg class="brand-mark" viewBox="0 0 34 34" aria-hidden="true">
        <rect width="34" height="34" rx="7" fill="var(--ink)"/>
        <path d="M9 24 a11 11 0 0 1 16 0" fill="none" stroke="var(--build)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M12 21 a6.5 6.5 0 0 1 10 0" fill="none" stroke="var(--operate)" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="17" cy="24" r="2.4" fill="var(--consume)"/>
      </svg>
      <span><b>DataCrew Telco</b><small>Build · Operate · Consume</small></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#overview" data-view="overview"><span class="dot"></span>Overview</a>
      <span class="nav-label">Agent planes</span>
      <a href="#build" data-view="build" style="--dot:var(--build)"><span class="dot"></span>Build with AI</a>
      <a href="#operate" data-view="operate" style="--dot:var(--operate)"><span class="dot"></span>Operate with AI</a>
      <a href="#consume" data-view="consume" style="--dot:var(--consume)"><span class="dot"></span>Consume with AI</a>
      <a href="#agents" data-view="agents"><span class="dot"></span>Agents &amp; skills</a>
      <span class="nav-label">People</span>
      <a href="#approvals" data-view="approvals" style="--dot:var(--warn)"><span class="dot"></span>Approvals<span class="count" id="badge-approvals" hidden>0</span></a>
      <a href="#teams" data-view="teams"><span class="dot"></span>Team enablement</a>
      <a href="#research" data-view="research"><span class="dot"></span>Market research</a>
    </nav>
    <div class="rail-foot">
      <label class="toggle"><input type="checkbox" id="auto"> Auto-sign (simulated)</label>
      <span>Fictional operator and people. Synthetic data only.</span>
    </div>
  </aside>
  <main><div id="view"></div></main>
</div>
<script src="data.js"></script>
<script src="agents-manifest.js"></script>
<script src="app.js"></script>
<!--ARTIFACT-END-->
</body>
</html>
